<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunar South Pole comparison map</title>
  <link rel="stylesheet" href="./scene.css">
  <script type="module" src="./compare.mjs"></script>
</head>
<body class="comparison-map">
  <main id="scene">
    <canvas id="moon" tabindex="0" aria-label="South Pole map. Drag or use the arrow keys to rotate."></canvas>
    <div id="markers" inert></div>
    <span class="map-direction" id="sun" hidden></span>
    <span class="map-direction" id="earth" hidden></span>
  </main>
</body>
</html>
